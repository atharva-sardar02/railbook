# Values for the hashicorp/vault Helm chart: one persistent Vault server + the Agent Injector.
# Install: helm upgrade --install vault hashicorp/vault --version 0.34.1 -n vault --create-namespace -f deploy/vault/values.yaml

server:
  # "ha" mode with Raft storage and a single replica: Vault's built-in storage engine on a PVC.
  # Data survives restarts (unlike dev mode). One replica = no high availability, which is fine here.
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          # Plain HTTP inside the cluster only; TLS is out of scope for a local setup.
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          telemetry {
            # Lets Prometheus scrape /v1/sys/metrics without a Vault token.
            unauthenticated_metrics_access = "true"
          }
        }

        storage "raft" {
          path = "/vault/data"
        }

        # mlock stops secrets in memory being swapped to disk. Raft storage uses memory-mapped
        # files, which don't work with mlock, so HashiCorp recommends disabling it with Raft.
        disable_mlock = true

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 1Gi

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

# Vault's web UI on a ClusterIP Service: open it with kubectl port-forward, never exposed publicly.
ui:
  enabled: true

injector:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 96Mi }
  # The chart's anti-affinity forbids two injector pods on one node. With one node, a
  # `kubectl rollout restart` (start new pod, then stop old) could never schedule the new pod.
  affinity: ""
  webhook:
    # Fail closed: if the API server can't reach the injector (e.g. its TLS CA in the webhook
    # config is stale), refuse to create the pod. The ReplicaSet/Job keeps retrying and the pod
    # is created, with its Vault containers, once the injector works. The chart's default,
    # Ignore, creates the pod WITHOUT them; it then crash-loops on a missing /vault/secrets file.
    failurePolicy: Fail
    # Fail closed must not block unrelated pods (kube-system, Kong, Prometheus...) when the
    # injector is down, so only pods that opt in with this label go through the webhook. The
    # injector's own pod doesn't carry it, so it can always start. (A string, like the chart's
    # default, so Helm replaces the default instead of warning about merging a map into it.)
    objectSelector: |
      matchLabels:
        vault-agent-inject: "true"
  # Defaults for the agent containers injected into app pods. The chart's defaults
  # (250m CPU, 64-128Mi each) are sized for production; ours serve a few requests a minute.
  agentDefaults:
    cpuRequest: "25m"
    cpuLimit: "200m"
    memRequest: "32Mi"
    memLimit: "64Mi"

# --- Monitoring (block 4). Needs the Prometheus Operator CRDs, which bootstrap.sh installs first.
serverTelemetry:
  # Scrapes /v1/sys/metrics?format=prometheus on the active Vault server (the `vault-active`
  # Service). No token needed: see unauthenticated_metrics_access in the listener above.
  serviceMonitor:
    enabled: true
    selectors:
      release: monitoring   # what kube-prometheus-stack's Prometheus selects on
    interval: 30s
  prometheusRules:
    enabled: true
    selectors:
      release: monitoring
    rules:
      # A sealed Vault can't hand out secrets: new pods (and DB credential renewals) fail.
      # When sealed, the pod drops out of the vault-active Service, so there's no metric with
      # value 1 at all. absent() turns "no such series" into an alert. Same for Vault down.
      - alert: VaultSealedOrDown
        expr: absent(vault_core_unsealed == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Vault is sealed or not reporting metrics
          description: >-
            No unsealed Vault server has reported metrics for 1 minute. New pods can't get
            secrets. Run scripts/vault-unseal.sh (or scripts/bootstrap.sh).
