# Log collector: ships the railbook and kong pods' stdout to Splunk.
# Apply: kubectl apply -f deploy/logging/otel-collector.yaml   (scripts/bootstrap.sh does this)
#
# How container logs reach a file: the app writes JSON lines to stdout (Twelve-Factor XI); the
# container runtime (containerd) writes every line to /var/log/pods/<ns>_<pod>_<uid>/<container>/N.log
# on the node. This collector runs once per node (DaemonSet), tails those files, and sends each
# line to Splunk's HTTP Event Collector (HEC). The app knows nothing about Splunk.
#
# Written by hand instead of the Splunk OTel Collector Helm chart: the chart always passes the HEC
# token through a Kubernetes Secret. Here Vault writes it to a file in the pod and the collector
# reads that file, so no Kubernetes Secret holds it (same rule as every other secret here).
---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
# The identity Vault checks: the Vault role `log-collector` only accepts this service account in
# this namespace (scripts/vault-setup.sh). It needs no Kubernetes API permissions at all: pod and
# namespace names are read from the log file paths.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: logging
data:
  config.yaml: |
    # An OpenTelemetry Collector pipeline: receivers → processors → exporters.
    extensions:
      # /  on :13133 answers 200 when the collector is up (used by the probes below).
      health_check:
        endpoint: 0.0.0.0:13133
      # Remembers how far each file has been read (on the node's disk, see the hostPath below),
      # so a collector restart neither re-sends old lines nor skips new ones.
      file_storage:
        directory: /var/lib/otel-collector

    receivers:
      filelog:
        # Only our namespaces: the Splunk Free license allows 500 MB/day, and Kubernetes'
        # own components are chatty. Path pattern: /var/log/pods/<namespace>_<pod>_<uid>/<container>/N.log
        include:
          - /var/log/pods/railbook_*/*/*.log
          - /var/log/pods/kong_*/*/*.log
        # First run: read existing files from the start. After that, file_storage resumes.
        start_at: beginning
        storage: file_storage
        operators:
          # The runtime wraps each line as "<time> <stdout|stderr> <F|P> <line>" (CRI format;
          # P = partial, a long line split in pieces). This operator unwraps it, rejoins partial
          # lines, uses the runtime's timestamp, and reads namespace, pod and container names
          # from the file path into resource attributes (k8s.namespace.name, k8s.pod.name, ...).
          - type: container
            add_metadata_from_filepath: true

    processors:
      # Refuse new data instead of crashing if memory gets tight (checked every second).
      memory_limiter:
        check_interval: 1s
        limit_mib: 100
        spike_limit_mib: 25
      # Splunk's sourcetype tells it what kind of data an event is. One per container:
      # kube:container:api (RailBook), kube:container:proxy (Kong), kube:container:vault-agent ...
      # The HEC exporter uses the attribute com.splunk.sourcetype for it.
      transform/sourcetype:
        log_statements:
          - context: resource
            statements:
              - set(attributes["com.splunk.sourcetype"], Concat(["kube:container:", attributes["k8s.container.name"]], ""))
              - set(attributes["k8s.cluster.name"], "railbook")
      # Send in batches (fewer HTTP requests to Splunk), at least every 5 s.
      batch:
        timeout: 5s

    exporters:
      splunk_hec:
        # The Splunk container, by name, on the shared `kind` Docker network (scripts/splunk.sh).
        endpoint: https://splunk:8088/services/collector
        # Read from the file Vault Agent wrote before the collector started (annotations below).
        token: ${file:/vault/secrets/hec-token}
        index: main
        source: kubernetes
        # Splunk's HEC uses a self-signed certificate. Acceptable only because both ends are
        # on this one machine; anywhere else, give the collector Splunk's CA instead.
        tls:
          insecure_skip_verify: true

    service:
      extensions: [health_check, file_storage]
      # The collector's own metrics (lines read, sent, failed) on :8888 for Prometheus.
      telemetry:
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, transform/sourcetype, batch]
          exporters: [splunk_hec]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: logging
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
      annotations:
        # Vault Agent init container: log in as otel-collector, write the HEC token (only the
        # token, whitespace trimmed) to /vault/secrets/hec-token, exit. No sidecar: it's static.
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: log-collector
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-hec-token: secret/data/splunk/hec
        vault.hashicorp.com/agent-inject-template-hec-token: |
          {{- with secret "secret/data/splunk/hec" -}}
          {{ .Data.data.token }}
          {{- end -}}
        # Changing the config must restart the pods; bump this when editing the ConfigMap
        # (kubectl apply alone doesn't restart them).
        railbook/config-version: "1"
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          # Splunk's distribution of the OpenTelemetry Collector, 0.161.0, pinned by digest.
          image: quay.io/signalfx/splunk-otel-collector:0.161.0@sha256:6cc58d3dca1e76464a043e060aca36fb44e0c7e283e7ad900aec873646014b84
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            # Splunk's build sizes the Go memory target from this (90 %); its default assumes
            # 512 MiB. Must match the container limit below.
            - name: SPLUNK_MEMORY_TOTAL_MIB
              value: "128"
          ports:
            - { name: metrics, containerPort: 8888 }
            - { name: health, containerPort: 13133 }
          livenessProbe:
            httpGet: { path: /, port: health }
          readinessProbe:
            httpGet: { path: /, port: health }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 128Mi }
          # Root is needed to read the node's log files (owned by root, mode 0640), but nothing
          # else: no capabilities, no privilege escalation, read-only image filesystem.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol, readOnly: true }
            - { name: pod-logs, mountPath: /var/log/pods, readOnly: true }
            - { name: checkpoints, mountPath: /var/lib/otel-collector }
      volumes:
        - name: config
          configMap: { name: otel-collector }
        # The node's directories, mounted into the pod.
        - name: pod-logs
          hostPath: { path: /var/log/pods }
        - name: checkpoints
          hostPath: { path: /var/lib/otel-collector, type: DirectoryOrCreate }
---
# Prometheus watches the log pipeline too (block 4): how many lines were read, sent and failed.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: logging
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - { name: metrics, port: 8888, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: logging
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-collector
  namespace: logging
  labels:
    release: monitoring
spec:
  groups:
    - name: logging
      rules:
        # Splunk unreachable, token rejected, ... : logs pile up and eventually get dropped.
        - alert: LogsNotReachingSplunk
          expr: sum(rate(otelcol_exporter_send_failed_log_records_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The log collector can't deliver logs to Splunk
            description: >-
              The collector failed to send log records to Splunk HEC for 5 minutes. Check
              `docker ps` (is splunk running?) and `kubectl -n logging logs ds/otel-collector`.
