# Postgres as a StatefulSet: a stable name (railbook-postgres-0) and its own disk that survives restarts.
---
# The identity Vault checks: the Vault role railbook-postgres only accepts this service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: railbook-postgres
---
# Runs once, only when the data directory is empty (first start).
# Creates the table-owner role; Vault later creates short-lived logins inside it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: railbook-postgres-init
data:
  01-roles.sql: |
    CREATE ROLE {{ .Values.ownerRole }} NOLOGIN;
    GRANT USAGE, CREATE ON SCHEMA public TO {{ .Values.ownerRole }};
---
# Headless Service (clusterIP: None): DNS name railbook-postgres points straight at the pod.
apiVersion: v1
kind: Service
metadata:
  name: railbook-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: railbook-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: railbook-postgres
spec:
  serviceName: railbook-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: railbook-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railbook-postgres
        # Opt-in for the Vault Agent Injector webhook (deploy/vault/values.yaml: objectSelector).
        vault-agent-inject: "true"
      annotations:
        # Vault Agent Injector: before Postgres starts, an init container logs into Vault as
        # this pod's service account and writes /vault/secrets/postgres.env.
        vault.hashicorp.com/agent-inject: "true"
        # Init container only, no sidecar: the password is only read on first start.
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-postgres.env: {{ .Values.vault.adminPasswordPath | quote }}
        vault.hashicorp.com/agent-inject-template-postgres.env: |
          {{`{{- with secret "`}}{{ .Values.vault.adminPasswordPath }}{{`" -}}`}}
          export POSTGRES_PASSWORD="{{`{{ .Data.data.password }}`}}"
          {{`{{- end }}`}}
    spec:
      serviceAccountName: railbook-postgres
      containers:
        - name: postgres
          image: {{ .Values.image }}
          # Load the Vault-rendered env file, then hand over to the image's normal entrypoint.
          # exec keeps Postgres as the process that receives SIGTERM.
          command: ["sh", "-c", ". /vault/secrets/postgres.env && exec docker-entrypoint.sh postgres"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database | quote }}
            # Subdirectory: the volume root contains lost+found, which initdb refuses to use.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", {{ .Values.database | quote }}]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: railbook-postgres-init
  # One PersistentVolumeClaim per replica, kept when pods restart (kind's local-path storage).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage }}
