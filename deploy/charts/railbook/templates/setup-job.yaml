# Factor XII: the admin process (migrate the schema + seed) runs as a one-off Job,
# with the same image, environment and Vault secrets as the API.
#
# It is a Helm hook. On upgrade it runs BEFORE the new API pods (pre-upgrade): new code may
# need the new schema, so the migration must come first. Migrations are therefore written so
# the old code still works on the new schema while it keeps serving (e.g. add a nullable
# column; never rename or drop in the same release). If the Job fails, the upgrade stops and
# the old pods keep running.
# On first install it runs after the release (post-install): before that, the service account
# and ConfigMap it uses don't exist yet.
#
# Jobs can't be edited once created, so before-hook-creation deletes the previous
# run's Job first. The finished Job is kept so you can inspect it (kubectl logs job/...).
apiVersion: batch/v1
kind: Job
metadata:
  name: railbook-setup
  labels:
    {{- include "railbook.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railbook-setup
        {{- include "railbook.labels" . | nindent 8 }}
        # Opt-in for the Vault Agent Injector webhook (deploy/vault/values.yaml: objectSelector).
        vault-agent-inject: "true"
      annotations:
        # Init container only. A sidecar never exits, and a Job only completes when every
        # container has exited — with a sidecar this Job would run forever.
        # Its DB user isn't renewed, so Vault drops it when the 1 h lease expires.
        {{- include "railbook.vaultAnnotations" (dict "root" . "prePopulateOnly" true) | nindent 8 }}
    spec:
      serviceAccountName: railbook-api
      restartPolicy: Never
      containers:
        - name: setup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "railbook.command" "python -m app.admin setup" | nindent 10 }}
          {{- include "railbook.apiEnv" . | nindent 10 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "railbook.apiSecurityContext" . | nindent 10 }}
