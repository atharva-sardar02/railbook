# Factor III: non-secret config as environment variables. Secrets are NOT allowed here; they come from Vault.
apiVersion: v1
kind: ConfigMap
metadata:
  name: railbook-config
  labels:
    {{- include "railbook.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.api.port | quote }}
  LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.database.name | quote }}
  DB_ROLE: {{ .Values.database.ownerRole | quote }}
  # Rendered by Vault Agent (templates/_helpers.tpl); holds the dynamic DB user + password.
  DB_CREDENTIALS_FILE: /vault/secrets/db.json
