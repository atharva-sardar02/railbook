# A Splunk "app" is just a folder of .conf files. This one only holds RailBook's saved searches,
# so they are versioned in git instead of clicked together in the UI.
# Copied to /opt/splunk/etc/apps/railbook by scripts/splunk.sh on every run.
[install]
state = enabled

[ui]
is_visible = false
label = RailBook

[launcher]
version = 1.0.0
description = Saved searches for RailBook logs
