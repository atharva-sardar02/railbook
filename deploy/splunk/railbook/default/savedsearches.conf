# RailBook saved searches. Open them in Splunk: Search & Reporting → Reports.
#
# Where the fields come from:
#   - sourcetype "kube:container:<container>" is set by the log collector
#     (deploy/logging/otel-collector.yaml): api = the RailBook API, proxy = Kong.
#   - Both write one JSON object per line. Splunk extracts JSON fields automatically at search
#     time, nested ones with dots: Kong's response.status, request.headers.x-request-id.

[RailBook - Errors by route]
description = API requests answered with 4xx or 5xx, by route and status (last 24 h).
search = index=main sourcetype="kube:container:api" event=request status>=400 \
| stats count by method, path, status \
| sort - count
dispatch.earliest_time = -24h
dispatch.latest_time = now

[RailBook - Follow one request]
description = Every Kong and API log line for one X-Request-ID. Run it with: | savedsearch "RailBook - Follow one request" request_id=<the id>
# $request_id$ is replaced by the argument given to the savedsearch command.
search = index=main "$request_id$" \
| eval component=case(sourcetype=="kube:container:proxy", "kong", sourcetype=="kube:container:api", "api", true(), sourcetype) \
| eval status=coalesce(status, 'response.status'), path=coalesce(path, 'request.uri') \
| table _time component path status duration_ms event \
| sort _time
dispatch.earliest_time = -24h
dispatch.latest_time = now

[RailBook - Rate limited (429)]
description = Requests Kong rejected with 429 (POST /bookings rate limit), per minute. These never reach the API.
search = index=main sourcetype="kube:container:proxy" response.status=429 \
| timechart span=1m count by request.method
dispatch.earliest_time = -24h
dispatch.latest_time = now
