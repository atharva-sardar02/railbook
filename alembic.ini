# Only for running Alembic by hand during development, e.g. a new migration against the
# local test Postgres (settings from env, as in tests/conftest.py):
#
#   DB_HOST=localhost DB_PORT=5433 DB_NAME=railbook DB_USER=railbook DB_PASSWORD=... PAYMENT_API_KEY=x \
#     uv run alembic revision --autogenerate --rev-id 0003 -m "what changes"
#
# In the cluster, migrations run from `python -m app.admin setup` (app/admin.py: migrate),
# which doesn't read this file.
[alembic]
script_location = app/migrations
# So env.py can `import app` (the CLI doesn't add the current directory to sys.path).
prepend_sys_path = .

# Format each new migration the way CI checks it (`ruff format --check`).
[post_write_hooks]
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = format REVISION_SCRIPT_FILENAME
